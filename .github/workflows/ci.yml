name: CI

on:
  push:
    branches: [main, Desenvolvimento]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root@127.0.0.1:3306/ecocondo
      # Os testes com banco real falham (em vez de serem ignorados) se o MySQL não responder.
      EXIGIR_MYSQL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Checagem de tipos
        run: pnpm check
      - name: Testes automatizados
        run: pnpm test
      - name: Migrações e dados de demonstração no MySQL
        run: pnpm db:seed
      - name: Build de produção
        run: pnpm build
